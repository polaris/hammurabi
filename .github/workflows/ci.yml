name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04 / gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          - name: ubuntu-24.04 / clang-19
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
          - name: macos-latest / apple-clang
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: ubuntu-24.04 / gcc-14 / asan+ubsan
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            sanitizers: address,undefined
          - name: ubuntu-24.04 / clang-19 / clang-tidy
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            tidy: "ON"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Clang 19
        if: matrix.cc == 'clang-19'
        run: sudo apt-get update && sudo apt-get install -y clang-19

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Detect Conan profile
        run: conan profile detect && conan profile show > conan-profile.txt

      # Restore and save are separate steps so the package cache is saved right after
      # `conan install`, even if the build or tests fail later in the job.
      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt', 'conan-profile.txt') }}

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=23 -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Save Conan cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

      - name: Configure
        run: cmake --preset conan-debug -DHAMMURABI_WARNINGS_AS_ERRORS=ON -DHAMMURABI_SANITIZERS=${{ matrix.sanitizers }} -DHAMMURABI_CLANG_TIDY=${{ matrix.tidy || 'OFF' }}

      - name: Build
        run: cmake --build --preset conan-debug --parallel

      - name: Test
        run: ctest --preset conan-debug --output-on-failure --no-tests=error
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror
